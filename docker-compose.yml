# 使用方式（选择一种 profile）：
#   手动生成一次:  docker compose up evolution
#   仅 Web 托管:    docker compose --profile serve up -d
#   完整模式(定时+Web): docker compose --profile full up -d
#
# 环境变量：
#   HERMES_HOME  — Hermes 数据目录（必填，如 ~/.hermes 或 C:/Users/xxx/AppData/Local/hermes）
#   PORT         — Web 服务端口（默认 57621）
#   EVOLUTION_LANG — 语言（默认 zh）

services:
  # 模式1: 手动执行/离线生成
  evolution:
    build: .
    container_name: hermes-evolution
    restart: "no"
    volumes:
      # 挂载 Hermes 数据目录（只读）
      - ${HERMES_HOME}:/hermes:ro
      # 挂载 scope-recall 召回数据（只读）
      - ${HERMES_HOME}/scope-recall:/hermes/scope-recall:ro
      # 挂载输出目录
      - ./output:/app/output
    environment:
      - TZ=Asia/Shanghai
      - EVOLUTION_LANG=${EVOLUTION_LANG:-zh}

  # 模式2: 仅 Web 托管（端口 57621）
  web:
    image: nginx:alpine
    container_name: hermes-evolution-web
    restart: unless-stopped
    ports:
      - "${PORT:-57621}:80"
    volumes:
      - ./output:/usr/share/nginx/html:ro
    profiles:
      - serve

  # 模式3: 完整模式 — 每日凌晨 2 点自动更新 + Nginx 托管 (端口 57621)
  cron:
    build: .
    container_name: hermes-evolution-cron
    restart: unless-stopped
    volumes:
      - ${HERMES_HOME}:/hermes:ro
      - ${HERMES_HOME}/scope-recall:/hermes/scope-recall:ro
      - ./output:/app/output
    environment:
      - TZ=Asia/Shanghai
      - EVOLUTION_LANG=${EVOLUTION_LANG:-zh}
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "0 2 * * * root cd /app && python generate.py --hermes-home /hermes --output-dir /app/output" > /etc/cron.d/hermes-evolution
        echo "0 3 * * 0 root cd /app && python generate.py --hermes-home /hermes --output-dir /app/output --full-rebuild" >> /etc/cron.d/hermes-evolution
        echo "" >> /etc/cron.d/hermes-evolution
        chmod 0644 /etc/cron.d/hermes-evolution
        cron -f
    profiles:
      - full

  nginx:
    image: nginx:alpine
    container_name: hermes-evolution-nginx
    restart: unless-stopped
    ports:
      - "${PORT:-57621}:80"
    volumes:
      - ./output:/usr/share/nginx/html:ro
    profiles:
      - full
