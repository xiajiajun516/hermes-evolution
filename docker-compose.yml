services:
  # 模式1: 手动运行
  evolution:
    build: .
    container_name: hermes-evolution
    restart: "no"
    volumes:
      - ${HERMES_HOME:-~/.hermes}:/hermes:ro
      - ./output:/app/output
    environment:
      - TZ=Asia/Shanghai
      - EVOLUTION_LANG=${EVOLUTION_LANG:-zh}

  # 模式2: 仅 Web 托管（手动更新 HTML）
  web:
    image: nginx:alpine
    container_name: hermes-evolution-web
    restart: unless-stopped
    ports:
      - "${PORT:-57621}:80"
    volumes:
      - ./output:/usr/share/nginx/html:ro
    profiles:
      - serve

  # 模式3: 完整自动模式 — 每日凌晨2点更新 + nginx 托管
  cron:
    build: .
    container_name: hermes-evolution-cron
    restart: unless-stopped
    volumes:
      - ${HERMES_HOME:-~/.hermes}:/hermes:ro
      - ./output:/app/output
    environment:
      - TZ=Asia/Shanghai
      - EVOLUTION_LANG=${EVOLUTION_LANG:-zh}
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "0 2 * * * root cd /app && python generate.py --hermes-home /hermes --output-dir /app/output" > /etc/cron.d/hermes-evolution
        echo "0 3 * * 0 root cd /app && python generate.py --hermes-home /hermes --output-dir /app/output --full-rebuild" >> /etc/cron.d/hermes-evolution
        echo "" >> /etc/cron.d/hermes-evolution
        chmod 0644 /etc/cron.d/hermes-evolution
        cron -f
    profiles:
      - full

  nginx:
    image: nginx:alpine
    container_name: hermes-evolution-nginx
    restart: unless-stopped
    ports:
      - "${PORT:-57621}:80"
    volumes:
      - ./output:/usr/share/nginx/html:ro
    profiles:
      - full
