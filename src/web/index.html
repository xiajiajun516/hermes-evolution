<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Evolution Log</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="dark-theme">
  <header id="app-header" class="site-header">
    <div class="header-brand">
      <svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="38" height="38">
        <defs>
          <linearGradient id="hermes-logo-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="50%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>
          <linearGradient id="hermes-logo-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#a855f7" />
          </linearGradient>
          <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <circle cx="50" cy="50" r="42" fill="none" stroke="url(#hermes-logo-grad-1)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.65" />
        <path d="M 30,25 C 45,35 55,65 70,75 C 55,65 45,35 30,25 Z" fill="url(#hermes-logo-grad-1)" opacity="0.85" filter="url(#logo-glow)" />
        <path d="M 70,25 C 55,35 45,65 30,75 C 45,65 55,35 70,25 Z" fill="url(#hermes-logo-grad-2)" opacity="0.85" filter="url(#logo-glow)" />
        <line x1="36" y1="33" x2="64" y2="33" stroke="url(#hermes-logo-grad-1)" stroke-width="2.5" stroke-linecap="round" />
        <line x1="43" y1="44" x2="57" y2="44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />
        <line x1="50" y1="50" x2="50" y2="50" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
        <line x1="43" y1="56" x2="57" y2="56" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />
        <line x1="36" y1="67" x2="64" y2="67" stroke="url(#hermes-logo-grad-2)" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="30" cy="25" r="4.5" fill="#38bdf8" filter="url(#logo-glow)" />
        <circle cx="70" cy="25" r="4.5" fill="#a855f7" filter="url(#logo-glow)" />
        <circle cx="30" cy="75" r="4.5" fill="#8b5cf6" filter="url(#logo-glow)" />
        <circle cx="70" cy="75" r="4.5" fill="#06b6d4" filter="url(#logo-glow)" />
        <circle cx="50" cy="50" r="3" fill="#ffffff" filter="url(#logo-glow)" />
      </svg>
      <div>
        <h1 id="header-title" class="brand-title">Hermes Evolution Log</h1>
        <p id="header-subtitle" class="brand-subtitle">AI 能力成长追踪</p>
      </div>
    </div>
    <div class="header-controls">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="global-search" class="search-input" placeholder="搜索 Skills / 记忆 / 档案...">
      </div>
      <div class="project-selector-wrapper" id="project-wrapper" style="display: none;">
        <select id="project-select" class="project-select">
          <option value="all">所有项目 (All)</option>
        </select>
      </div>
      <button id="lang-toggle" class="btn btn-secondary lang-btn" title="切换语言 / Switch Language">
        🌐 <span id="lang-label">EN</span>
      </button>
    </div>
  </header>

  <nav id="app-tabs" class="site-tabs">
    <button class="tab-btn active" data-tab="dashboard">
      <span class="tab-icon">📊</span> <span data-i18n="tab_dashboard">仪表盘</span>
    </button>
    <button class="tab-btn" data-tab="skills">
      <span class="tab-icon">🛠️</span> <span data-i18n="tab_skills">Skills 技能</span>
    </button>
    <button class="tab-btn" data-tab="memory">
      <span class="tab-icon">🧠</span> <span data-i18n="tab_memory">持久记忆</span>
    </button>
    <button class="tab-btn" data-tab="archive">
      <span class="tab-icon">📚</span> <span data-i18n="tab_archive">进化档案</span>
    </button>
  </nav>

  <main id="app-content" class="site-content">
    <div class="loading-spinner">
      <div class="spinner"></div>
      <p data-i18n="loading">加载数据中...</p>
    </div>
  </main>

  <footer id="app-footer" class="site-footer">
    <p><span data-i18n="page_updated">最近更新</span><span data-i18n="page_updated_sep">：</span><span id="footer-updated">-</span></p>
    <p class="powered-by">Powered by <strong>Nous Hermes Agent</strong></p>
  </footer>

  <div id="modal-container"></div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
