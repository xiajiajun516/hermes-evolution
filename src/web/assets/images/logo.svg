<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40">
  <defs>
    <linearGradient id="hermes-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="hermes-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Orbit Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#hermes-grad-1)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.65" />

  <!-- Core Evolution Helix Nodes & Waves -->
  <path d="M 30,25 C 45,35 55,65 70,75 C 55,65 45,35 30,25 Z" fill="url(#hermes-grad-1)" opacity="0.85" filter="url(#glow)" />
  <path d="M 70,25 C 55,35 45,65 30,75 C 45,65 55,35 70,25 Z" fill="url(#hermes-grad-2)" opacity="0.85" filter="url(#glow)" />

  <!-- DNA Rung Connections -->
  <line x1="36" y1="33" x2="64" y2="33" stroke="url(#hermes-grad-1)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="43" y1="44" x2="57" y2="44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <line x1="50" y1="50" x2="50" y2="50" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <line x1="43" y1="56" x2="57" y2="56" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <line x1="36" y1="67" x2="64" y2="67" stroke="url(#hermes-grad-2)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Sparkling Evolution Points -->
  <circle cx="30" cy="25" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="70" cy="25" r="4.5" fill="#a855f7" filter="url(#glow)" />
  <circle cx="30" cy="75" r="4.5" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="70" cy="75" r="4.5" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="50" cy="50" r="3" fill="#ffffff" filter="url(#glow)" />
</svg>
